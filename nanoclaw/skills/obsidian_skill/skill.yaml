name: obsidian_skill
version: "1.0"
description: "Sandboxed read/write access to the Obsidian vault"
actions:
  - read_file
  - create_file
  - update_file
  - list_files
  - find_tasks
volumes:
  workspace:
    host_path: "${WORKSPACE_DIR}"
    container_path: /vault
    mode: ro   # default read-only; overridden to rw when write=True passed to run_skill()
